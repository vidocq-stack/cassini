# What Vidocq's build (vidocq:generate) needs to run this processor over the jars of an application's
# dependencies: a JAX-RS resource class of a library compiled without cassini-processor gets its adapter and
# its routes in the library's enriched copy, instead of at each start (Vidocq/vidocq#662). The processor gets the
# class names of the jar (javac -proc:only), so it reads the class files.
#
# class-bytes: the internal name of @Path, whole: it must not select a jar for @PathParam alone. A jar that defines
#              the annotation (jakarta.ws.rs-api) is not selected.
# markers/merge: the service files this processor writes. A jar compiled with the processor already has them.
brick=Cassini
class-bytes=jakarta/ws/rs/Path
markers=META-INF/services/io.vidocq.cassini.spi.gen.ResourceAdapter,META-INF/services/io.vidocq.cassini.spi.gen.RouteProvider
merge=META-INF/services/io.vidocq.cassini.spi.gen.ResourceAdapter,META-INF/services/io.vidocq.cassini.spi.gen.RouteProvider
