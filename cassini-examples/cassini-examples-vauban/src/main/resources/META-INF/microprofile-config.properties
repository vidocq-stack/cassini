# Propriétés de configuration de l'exemple Cassini + Ravel
# MicroProfile Config 3.1 — ravel-cdi-vauban fournit l'implémentation

# Salutation (injectée via @ConfigProperty dans ConfigDemoResource)
app.greeting=Hello from Cassini + Ravel
app.version=0.1.0

# app.env est optionnel — non défini ici intentionnellement
# (sera Optional.empty() dans ConfigDemoResource)

# Profils (activez avec -Dmp.config.profile=dev ou MP_CONFIG_PROFILE=dev)
%dev.app.greeting=Hello from DEV
%dev.app.env=development
%prod.app.greeting=Welcome
%prod.app.env=production

