name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build & test
        run: mvn --no-transfer-progress verify

      - name: Deploy to Forgejo Maven registry
        run: mvn -B -ntp deploy -DskipTests

      # cassini-tck est volontairement hors reactor (pom Model 4.0.0 standalone,
      # contrainte ShrinkWrap). Le `mvn deploy` ci-dessus ne le couvre pas.
      # On le build et deploy séparément avec maven.test.skip=true pour éviter
      # d'avoir besoin du TCK Jakarta officiel (artefact non public requis pour
      # la compile-test). knock-tck consomme cassini-tck:0.1.0-SNAPSHOT, donc
      # ce step est nécessaire pour que knock CI passe.
      - name: Build et deploy cassini-tck (hors reactor)
        run: |
          mvn -B -ntp -f cassini-tck/pom.xml \
              deploy -Dmaven.test.skip=true \
              -DaltDeploymentRepository=vidocq-snapshots::https://repo.vidocq.dev/snapshots
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "❌ Secret Forgejo manquant : SLACK_WEBHOOK_URL" >&2
            exit 1
          fi
          payload=$(node <<'JS'
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: ❌ *Build CI échoué* — \`${process.env.REPO}\`@${process.env.REF}\n<${process.env.RUN_URL}|Voir le run>`
          }))
          JS
          )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
